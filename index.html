<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apply for a pass · GatePass</title>
<meta name="description" content="Browse events and apply for a free GatePass entry pass.">
<meta name="theme-color" content="#F6EFE3">
<script>try{const saved=localStorage.getItem("gp.theme");document.documentElement.dataset.theme=saved==="light"||saved==="dark"?saved:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch{document.documentElement.dataset.theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}</script>
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/oswald-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/gatepass.css">
<script defer src="config.js"></script>
<script defer src="assets/js/theme.js"></script>
<script defer src="assets/js/visual.js"></script>
<script defer src="vendor/supabase.js"></script>
<script type="module" src="assets/js/attendee.js"></script>
</head>
<body class="wide">
<main class="app">
  <header class="mast">
    <a class="logo ink" href="./">GatePass</a>
    <div class="attendee-auth" id="authBar" aria-live="polite"></div>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false"><span class="theme-toggle-glyph" aria-hidden="true"></span></button>
  </header>
  <div id="view" aria-live="polite">
    <div class="skeleton" style="height:220px" aria-label="Loading events"></div>
  </div>
  <footer class="foot attendee-footer">
    <a href="host/">Host an event</a>
    <a href="gate/">Gate pass scan</a>
  </footer>
  <div class="scallops inked" aria-hidden="true"></div>
</main>
</body>
</html>
